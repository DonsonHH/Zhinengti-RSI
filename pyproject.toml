[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renly-patrol-rsi"
version = "0.1.0"
description = "Paper-derived persistent patrolling reference and RSI experiment interfaces"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
neural = ["torch>=2.6,<2.7", "torchvision>=0.21,<0.22"]
plots = ["matplotlib>=3.10,<3.11"]
open-model = ["transformers==4.51.3", "accelerate==1.6.0", "huggingface-hub==0.30.2", "tokenizers==0.21.1", "safetensors==0.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
