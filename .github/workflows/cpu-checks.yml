name: Lightweight CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install CPU dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Check formal-study and information-audit contracts
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_formal_study.py -v
          python -m unittest discover -s tests -p test_information_audit.py -v
          python -m unittest discover -s tests -p test_opportunity_data.py -v
      - name: Compile package and scripts
        run: python -m compileall -q src scripts
